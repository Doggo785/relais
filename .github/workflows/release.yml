# release-please tient la version et le changelog ; quand une version sort,
# on construit l'APK signé et on l'attache à la GitHub Release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run vendor && npx cap sync android
      - name: Build signed APK
        env:
          RELAIS_KEYSTORE: ${{ runner.temp }}/relais.jks
          RELAIS_KEYSTORE_BASE64: ${{ secrets.RELAIS_KEYSTORE_BASE64 }}
          RELAIS_KEYSTORE_PASSWORD: ${{ secrets.RELAIS_KEYSTORE_PASSWORD }}
          RELAIS_KEY_ALIAS: ${{ secrets.RELAIS_KEY_ALIAS }}
          RELAIS_KEY_PASSWORD: ${{ secrets.RELAIS_KEY_PASSWORD }}
        run: |
          echo "$RELAIS_KEYSTORE_BASE64" | base64 -d > "$RELAIS_KEYSTORE"
          cd android && ./gradlew --no-daemon assembleRelease
          rm "$RELAIS_KEYSTORE"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "relais-${TAG}.apk"
          gh release upload "$TAG" "relais-${TAG}.apk"
